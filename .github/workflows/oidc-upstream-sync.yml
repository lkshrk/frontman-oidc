name: Sync OIDC fork with upstream

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional stable upstream tag, for example v2.0.0"
        required: false
        type: string
      dry_run:
        description: "Merge and verify without publishing"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: oidc-upstream-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Merge and verify upstream
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.prepare.outputs.commit }}
      dry_run: ${{ steps.prepare.outputs.dry_run }}
      exact_tag: ${{ steps.prepare.outputs.exact_tag }}
      skip: ${{ steps.prepare.outputs.skip }}
      tag: ${{ steps.prepare.outputs.tag }}
      tag_commit: ${{ steps.prepare.outputs.tag_commit }}
      tag_object: ${{ steps.prepare.outputs.tag_object }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CLOAK_KEY: "dGVzdC1rZXktZm9yLWNpLXRoaXMtaXMtMzJieXRlc3M="
      MIX_TEST_DB_SUFFIX: "_oidc_sync_${{ github.run_id }}"

    steps:
      - name: Checkout fork without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select release and merge
        id: prepare
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
          INPUT_TAG: ${{ inputs.tag || '' }}
        run: |
          set -euo pipefail

          UPSTREAM="https://github.com/frontman-ai/frontman.git"
          TARGET_BRANCH="main"

          {
            echo "bundle=false"
            echo "dry_run=${DRY_RUN}"
            echo "exact_tag=false"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"

          git remote add upstream "$UPSTREAM" || git remote set-url upstream "$UPSTREAM"
          git fetch origin "$TARGET_BRANCH" --tags
          git fetch --no-tags upstream \
            "refs/heads/main:refs/remotes/upstream/main"

          if [ -n "$INPUT_TAG" ]; then
            UPSTREAM_TAG="$INPUT_TAG"
          else
            UPSTREAM_TAG="$(
              git ls-remote --tags --refs upstream "refs/tags/v*" \
                | awk '
                    $2 ~ /^refs\/tags\/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ {
                      sub(/^refs\/tags\//, "", $2)
                      print $2
                    }
                  ' \
                | sort -V \
                | tail -1
            )"
          fi

          if [ -z "$UPSTREAM_TAG" ]; then
            echo "No stable upstream release tag found."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$UPSTREAM_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag must be a stable semantic version: ${UPSTREAM_TAG}"
            exit 1
          fi

          echo "tag=${UPSTREAM_TAG}" >> "$GITHUB_OUTPUT"

          UPSTREAM_REF="refs/upstream-tags/${UPSTREAM_TAG}"
          BUNDLE_REF="refs/oidc-sync/${UPSTREAM_TAG}"
          SYNC_BRANCH="sync/${UPSTREAM_TAG}"

          git fetch --no-tags upstream \
            "refs/tags/${UPSTREAM_TAG}:${UPSTREAM_REF}"
          TAG_OBJECT="$(git rev-parse "${UPSTREAM_REF}")"
          TAG_COMMIT="$(git rev-parse "${UPSTREAM_REF}^{commit}")"
          echo "tag_object=${TAG_OBJECT}" >> "$GITHUB_OUTPUT"
          echo "tag_commit=${TAG_COMMIT}" >> "$GITHUB_OUTPUT"

          if ! git merge-base --is-ancestor \
            "$TAG_COMMIT" "refs/remotes/upstream/main"; then
            echo "${UPSTREAM_TAG} is not reachable from upstream/main."
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/${UPSTREAM_TAG}"; then
            if [ "$(git cat-file -t "refs/tags/${UPSTREAM_TAG}")" != "tag" ]; then
              echo "Fork tag ${UPSTREAM_TAG} must be annotated."
              exit 1
            fi
            FORK_TAG_COMMIT="$(git rev-parse "refs/tags/${UPSTREAM_TAG}^{commit}")"

            if [ "$FORK_TAG_COMMIT" = "$TAG_COMMIT" ] ||
              ! git merge-base --is-ancestor "$TAG_COMMIT" "$FORK_TAG_COMMIT" ||
              ! git merge-base --is-ancestor \
                "$FORK_TAG_COMMIT" "origin/${TARGET_BRANCH}"; then
              echo "Fork tag ${UPSTREAM_TAG} is inconsistent with upstream or main."
              exit 1
            fi

            echo "Fork already has verified OIDC release ${UPSTREAM_TAG}."
            {
              echo "exact_tag=true"
              echo "skip=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git switch -C "$SYNC_BRANCH" "origin/${TARGET_BRANCH}"
          git merge --no-edit "$UPSTREAM_REF"

          COMMIT="$(git rev-parse HEAD)"
          git update-ref "$BUNDLE_REF" "$COMMIT"
          git bundle create sync.bundle "$BUNDLE_REF" "$UPSTREAM_REF"

          {
            echo "bundle=true"
            echo "commit=${COMMIT}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload candidate commit
        if: steps.prepare.outputs.bundle == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oidc-sync-${{ github.run_id }}
          path: sync.bundle
          if-no-files-found: error

      - name: Setup Node.js
        if: steps.prepare.outputs.skip != 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.4.1"

      - name: Enable Corepack
        if: steps.prepare.outputs.skip != 'true'
        run: corepack enable && corepack install

      - name: Install native build dependencies
        if: steps.prepare.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake libssl-dev libncurses5-dev postgresql-client

      - name: Setup Erlang/Elixir via mise
        if: steps.prepare.outputs.skip != 'true'
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Install Hex/Rebar
        if: steps.prepare.outputs.skip != 'true'
        run: >-
          env -u GITHUB_ENV -u GITHUB_OUTPUT -u GITHUB_PATH
          -u GITHUB_STATE -u GITHUB_STEP_SUMMARY
          make setup-elixir-tools

      - name: Run required checks
        if: steps.prepare.outputs.skip != 'true'
        run: |
          set -euo pipefail

          run_candidate() {
            env \
              -u GITHUB_ENV \
              -u GITHUB_OUTPUT \
              -u GITHUB_PATH \
              -u GITHUB_STATE \
              -u GITHUB_STEP_SUMMARY \
              "$@"
          }

          run_candidate make install
          run_candidate make -C apps/frontman_server install
          run_candidate make -C apps/frontman_server lint
          run_candidate make -C apps/frontman_server build
          run_candidate make -C apps/frontman_server test
          run_candidate make e2e-oidc-install-browser
          run_candidate make e2e-oidc

          git diff --quiet
          git diff --cached --quiet

  publish:
    name: Publish verified candidate
    needs: verify
    if: >-
      needs.verify.result == 'success' &&
      needs.verify.outputs.tag != '' &&
      needs.verify.outputs.dry_run != 'true' &&
      (
        needs.verify.outputs.skip != 'true' ||
        needs.verify.outputs.exact_tag == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout fork main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: main
          token: ${{ github.token }}

      - name: Download candidate commit
        if: needs.verify.outputs.exact_tag != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oidc-sync-${{ github.run_id }}

      - name: Publish
        env:
          CANDIDATE_COMMIT: ${{ needs.verify.outputs.commit }}
          EXACT_TAG: ${{ needs.verify.outputs.exact_tag }}
          GH_TOKEN: ${{ github.token }}
          RETRY_IMAGE: ${{ github.event_name == 'workflow_dispatch' }}
          UPSTREAM_TAG: ${{ needs.verify.outputs.tag }}
          UPSTREAM_TAG_COMMIT: ${{ needs.verify.outputs.tag_commit }}
          UPSTREAM_TAG_OBJECT: ${{ needs.verify.outputs.tag_object }}
        run: |
          set -euo pipefail

          TARGET_BRANCH="main"

          if [[ ! "$UPSTREAM_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] ||
            [[ ! "$UPSTREAM_TAG_COMMIT" =~ ^[0-9a-f]{40}$ ]] ||
            [[ ! "$UPSTREAM_TAG_OBJECT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid verified release metadata."
            exit 1
          fi

          publish_image() {
            gh workflow run docker-publish.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$UPSTREAM_TAG" \
              -f "tag=$UPSTREAM_TAG"
          }

          publish_release() {
            if gh release view "$UPSTREAM_TAG" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              return
            fi

            gh release create "$UPSTREAM_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$UPSTREAM_TAG" \
              --generate-notes
          }

          validate_fork_tag() {
            local ref="$1"
            local fork_tag_commit
            fork_tag_commit="$(git rev-parse "${ref}^{commit}")"

            if [ "$(git cat-file -t "$ref")" != "tag" ] ||
              [ "$fork_tag_commit" = "$UPSTREAM_TAG_COMMIT" ] ||
              ! git merge-base --is-ancestor \
                "$UPSTREAM_TAG_COMMIT" "$fork_tag_commit" ||
              ! git merge-base --is-ancestor \
                "$fork_tag_commit" "origin/${TARGET_BRANCH}"; then
              echo "Invalid fork release tag: ${ref}."
              exit 1
            fi
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$TARGET_BRANCH" --tags

          if [ "$EXACT_TAG" = "true" ]; then
            validate_fork_tag "refs/tags/${UPSTREAM_TAG}"
            publish_release
            if [ "$RETRY_IMAGE" = "true" ]; then
              publish_image
            fi
            exit 0
          fi

          if [[ ! "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]] ||
            [ ! -f sync.bundle ]; then
            echo "Invalid candidate bundle."
            exit 1
          fi

          git bundle verify sync.bundle
          git fetch sync.bundle \
            "refs/oidc-sync/${UPSTREAM_TAG}:refs/heads/oidc-sync-candidate"
          git fetch sync.bundle \
            "refs/upstream-tags/${UPSTREAM_TAG}:refs/oidc-upstream-tags/${UPSTREAM_TAG}"

          IMPORTED_COMMIT="$(git rev-parse oidc-sync-candidate)"
          IMPORTED_TAG_OBJECT="$(
            git rev-parse "refs/oidc-upstream-tags/${UPSTREAM_TAG}"
          )"
          IMPORTED_TAG_COMMIT="$(
            git rev-parse "refs/oidc-upstream-tags/${UPSTREAM_TAG}^{commit}"
          )"

          if [ "$IMPORTED_COMMIT" != "$CANDIDATE_COMMIT" ] ||
            [ "$IMPORTED_TAG_OBJECT" != "$UPSTREAM_TAG_OBJECT" ] ||
            [ "$IMPORTED_TAG_COMMIT" != "$UPSTREAM_TAG_COMMIT" ] ||
            ! git merge-base --is-ancestor \
              "origin/${TARGET_BRANCH}" "$CANDIDATE_COMMIT"; then
            echo "Candidate bundle does not match verified outputs."
            exit 1
          fi

          ORIGIN_TAG_REF="refs/oidc-origin-tags/${UPSTREAM_TAG}"
          if git fetch --no-tags origin \
            "refs/tags/${UPSTREAM_TAG}:${ORIGIN_TAG_REF}" >/dev/null 2>&1; then
            validate_fork_tag "$ORIGIN_TAG_REF"
            publish_release
            if [ "$RETRY_IMAGE" = "true" ]; then
              publish_image
            fi
            exit 0
          fi

          git tag -a "$UPSTREAM_TAG" "$CANDIDATE_COMMIT" \
            -m "Frontman ${UPSTREAM_TAG} with OIDC"
          git -c core.hooksPath=/dev/null push --atomic origin \
            "${CANDIDATE_COMMIT}:refs/heads/${TARGET_BRANCH}" \
            "refs/tags/${UPSTREAM_TAG}:refs/tags/${UPSTREAM_TAG}"

          publish_release
          publish_image
