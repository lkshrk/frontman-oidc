name: Docker

on:
  pull_request:
    branches:
      - main
    paths:
      - ".dockerignore"
      - ".github/workflows/docker-publish.yml"
      - "apps/frontman_server/**"
      - "apps/marketing/package.json"
      - "apps/swarm_ai/**"
      - "libs/**"
      - "package.json"
      - "rescript.json"
      - "test/**/package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  pr-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build pull request image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/frontman_server/Dockerfile
          platforms: linux/amd64
          push: false

  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: oidc-docker-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag must be stable semver (vX.Y.Z)"
            exit 1
          fi

      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Select image tags
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git fetch --force --tags origin
          latest="$(
            git tag --list 'v*' |
              awk '/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ { print }' |
              sort -V |
              tail -1
          )"
          if [ "$RELEASE_TAG" = "$latest" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/frontman_server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/lkshrk/frontman-oidc:${{ inputs.tag }}
            ${{ steps.release.outputs.latest == 'true' && 'ghcr.io/lkshrk/frontman-oidc:latest' || '' }}
